services:
  mongodb:
    image: mongo:7
    container_name: learnable-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  falkordb:
    image: falkordb/falkordb:latest
    container_name: learnable-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: learnable-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    depends_on:
      mongodb:
        condition: service_healthy
      falkordb:
        condition: service_healthy

volumes:
  mongodb_data:
  falkordb_data:
